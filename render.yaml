services:
  - type: web
    name: clipforge-nabigh-api
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_VIDEO_DURATION
        value: "10800"
      - key: MAX_CLIPS
        value: "8"
      - key: MAX_TOTAL_CLIP_SECONDS
        value: "900"
      - key: JOB_TTL_SECONDS
        value: "1800"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
